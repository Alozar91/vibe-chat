# Vibe Chat — тестовый стенд: системный nginx хоста с location /chat (Docs/concept.md §13).
# Схема (решено 2026-11-13): nginx отдельным сервисом системы, ДВЕ секции:
#   location /know → http://localhost:<порт другого проекта>
#   location /chat → http://localhost:8090 (vibe-chat: фронт+API+WS, см. nginx-location-snippet)
# Чужие конфиги не трогаются: vibe-chat живёт на своих localhost-портах.
# Локальная работа nginx не использует.
#
# Запуск: docker compose -f deploy/docker-compose.server.yml --env-file deploy/server.env up -d --build
# Сниппет для системного nginx — deploy/nginx-location-snippet.conf
name: vibe-chat-server

services:
  frontend:
    image: nginx:1.27-alpine
    depends_on: []
    ports:
      - "127.0.0.1:8090:80"   # системный nginx ходит сюда (location /chat)
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # собранный SPA (npm run build с VITE_BASE_PATH=/chat/)
      - ../frontend/dist:/usr/share/nginx/html:ro

  backend:
    image: backend:server
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      APP_DB_URL: postgresql+asyncpg://vibe:${POSTGRES_PASSWORD:-vibe-server}@postgres:5432/vibe
      APP_VALKEY_URL: valkey://valkey:6379/0
      APP_SILO_INTERNAL_URL: http://silo:9000
      # presigned URLs идут через системный nginx (Host входит в подпись, §8)
      APP_SILO_PUBLIC_URL: https://${VIBE_DOMAIN}/silo
      APP_SILO_ACCESS_KEY: ${SILO_ROOT_USER:-vibe}
      APP_SILO_SECRET_KEY: ${SILO_ROOT_PASSWORD:-vibe-secret}
      APP_SILO_BUCKET: vibe-files
      APP_KEYCLOAK_URL: https://${VIBE_DOMAIN}:8444
      APP_KEYCLOAK_REALM: vibe-chat
      APP_KEYCLOAK_AUDIENCE: backend-api
      APP_KEYCLOAK_ADMIN_CLIENT_ID: backend-admin
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_BACKEND_ADMIN_SECRET:-change-me-backend-admin-secret}
      APP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      APP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      APP_LIVEKIT_WS_URL: wss://${VIBE_DOMAIN}/livekit
      APP_CALL_RING_TIMEOUT_SECONDS: 45
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      silo:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"  # системный nginx → /chat/api/

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe-server}
      POSTGRES_DB: vibe
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    volumes:
      - valkeydata:/data

  silo:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-vibe}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-vibe-secret}
      # CORS: presigned PUT — same-origin через системный nginx (/silo/ → silo:9000),
      # но разрешим и localhost:5173 на всякий случай для dev-сценариев
      MINIO_API_CORS_ALLOW_ORIGIN: https://${VIBE_DOMAIN}
    command: server /data
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9001:9001"  # админка Silo (консоль) только с localhost
    volumes:
      - silodata:/data

  keycloak:
    image: keycloak/keycloak:26.8
    command: start-dev --import-realm -Dkeycloak.migration.replace-placeholders=true
    environment:
      KC_HOSTNAME: https://${VIBE_DOMAIN}:8444
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      VIBE_PUBLIC_URL: https://${VIBE_DOMAIN}/chat
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"  # системный nginx → 8444 (server-блок) или напрямую
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-ip ${VIBE_DOMAIN}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    volumes:
      - ./livekit/livekit-server.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
  valkeydata:
  silodata:
