# Vibe Chat — тестовый стенд: системный nginx хоста с location /chat (Docs/concept.md §13).
# Схема (решено 2026-11-13): nginx отдельным сервисом системы — единая точка входа,
#   /know → 127.0.0.1:8082 (vibe-know, его контейнерный nginx; деплой позже)
#   /chat → 127.0.0.1:8090 (vibe-chat: фронт+API+WS, см. nginx-location-snippet.conf)
# Чужие конфиги не трогаются: vibe-chat живёт на своих localhost-портах.
# Локальная работа nginx не использует.
#
# Порты vibe-chat на хосте (все 127.0.0.1, кроме LiveKit):
#   8090 frontend-nginx | 8002 backend (debug; 8001 занят kb-api) | 8081 Keycloak
#   9002 Silo S3 API (presigned /vibe-files/) | 9003 Silo-консоль | 7881+UDP LiveKit
# Порты vibe-know (при деплое): 8082 nginx | 8001 api | 8080 KC | 5432/6379/9090…
#
# Запуск: docker compose -f deploy/docker-compose.server.yml --env-file deploy/server.env up -d --build
# Сниппет для системного nginx — deploy/nginx-location-snippet.conf
name: vibe-chat-server

services:
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: []
    ports:
      - "127.0.0.1:8090:80"   # системный nginx ходит сюда (location /chat)
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # собранный SPA (npm run build с VITE_BASE_PATH=/chat/)
      - ../frontend/dist:/usr/share/nginx/html:ro

  backend:
    image: backend:server
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      APP_DB_URL: postgresql+asyncpg://vibe:${POSTGRES_PASSWORD:-vibe-server}@postgres:5432/vibe
      APP_VALKEY_URL: valkey://valkey:6379/0
      APP_SILO_INTERNAL_URL: http://silo:9000
      # presigned URLs идут через системный nginx (Host входит в подпись, §8)
      # БЕЗ пути: host входит в подпись presigned URL; системный nginx отдаёт Silo по /vibe-files/
  APP_SILO_PUBLIC_URL: https://${VIBE_DOMAIN}
      APP_SILO_ACCESS_KEY: ${SILO_ROOT_USER:-vibe}
      APP_SILO_SECRET_KEY: ${SILO_ROOT_PASSWORD:-vibe-secret}
      APP_SILO_BUCKET: vibe-files
      APP_KEYCLOAK_URL: https://${VIBE_DOMAIN}:8444
      APP_KEYCLOAK_REALM: vibe-chat
      APP_KEYCLOAK_AUDIENCE: backend-api
      APP_KEYCLOAK_ADMIN_CLIENT_ID: backend-admin
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_BACKEND_ADMIN_SECRET:-change-me-backend-admin-secret}
      APP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      APP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # путь под /chat: системный nginx → frontend-nginx (/chat/livekit/ → livekit:7880)
      APP_LIVEKIT_WS_URL: wss://${VIBE_DOMAIN}/chat/livekit
      APP_CALL_RING_TIMEOUT_SECONDS: 45
      # открытая регистрация без инвайт-кода (§5); false = только по кодам
      APP_OPEN_REGISTRATION: ${APP_OPEN_REGISTRATION:-false}
      # seed платформенного админа (python -m app.scripts.seed_admin, §13)
      SEED_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      silo:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8000"  # debug-порт; kb-api тоже на 8001 → здесь 8002. Роутинг — через frontend-контейнер (docker-сеть), хост-порт не участвует

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe-server}
      POSTGRES_DB: vibe
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    volumes:
      - valkeydata:/data

  silo:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-vibe}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-vibe-secret}
      # CORS: presigned PUT - same-origin через системный nginx (/vibe-files/ → silo:9000),
      # но разрешим и localhost:5173 на всякий случай для dev-сценариев
      MINIO_API_CORS_ALLOW_ORIGIN: https://${VIBE_DOMAIN}
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9002:9000"   # S3 API - системный nginx → /vibe-files/ (presigned)
      - "127.0.0.1:9003:9001"   # консоль — только с localhost
    volumes:
      - silodata:/data

  keycloak:
    image: keycloak/keycloak:26.8
    # ${VIBE_PUBLIC_URL/ORIGIN} из realm-export.json подставляются из env
    # при --import-realm (KC 26: плейсхолдеры без префикса env.)
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: https://${VIBE_DOMAIN}:8444
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      # redirectUris клиента frontend — https://домен/chat/* (подпуть SPA)
      VIBE_PUBLIC_URL: https://${VIBE_DOMAIN}/chat
      # webOrigins — origin БЕЗ пути (CORS токен-запросов SPA → KC:8444)
      VIBE_PUBLIC_ORIGIN: https://${VIBE_DOMAIN}
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # секрет клиента backend-admin — тот же var, что бэкенд берёт как
      # APP_KEYCLOAK_ADMIN_CLIENT_SECRET: realm импортируется с этим секретом
      KC_BACKEND_ADMIN_SECRET: ${KC_BACKEND_ADMIN_SECRET:-change-me-backend-admin-secret}
    ports:
      - "127.0.0.1:8081:8080"  # системный nginx → 8444 (server-блок) или напрямую
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  livekit:
    image: livekit/livekit-server:latest
    # без --node-ip: use_external_ip: true сам определит публичный IP
    # (VIBE_DOMAIN — доменное имя, флагу нужен IP)
    command: --config /etc/livekit.yaml
    # STUN-резолв: resolv.conf хоста указывает на stub systemd-resolved
    # (127.0.0.53), недоступный изнутри контейнера → без явного dns
    # livekit падает "could not resolve external IP"
    dns: [1.1.1.1, 8.8.8.8]
    restart: unless-stopped
    environment:
      # ключи обязательны (server.env): одновременно и SFU, и бэкенд
      # (APP_LIVEKIT_API_KEY/SECRET) — источник один, рассинхрон исключён
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7881:7881"
      # 100 портов достаточно для MVP-стенда (~25-50 одновременных звонков);
      # полный диапазон 50000-60000 не даёт преимуществ, а docker-proxy на
      # каждый опубликованный UDP-порт (userland) съедает ГБ памяти (набл. 2026-11-18).
      # Для прода: userland-proxy=false в daemon.json либо один mux-порт.
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit/livekit-server.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
  valkeydata:
  silodata:
