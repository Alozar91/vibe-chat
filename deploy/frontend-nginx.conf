# vibe-chat frontend за системным nginx хоста (location /chat → этот контейнер :80).
# Системный nginx передаёт путь как есть (/chat/...), этот nginx обслуживает префикс.
#
# Upstream'ы — через переменные + docker-DNS (resolver 127.0.0.11): nginx стартует
# даже если backend/livekit ещё не подняты (иначе [emerg] host not found in
# upstream → exit 1 на старте) и не держит стухший IP после их пересоздания.

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA под подпутью: /chat/assets/... → dist/assets/... (alias выравнивает префикс)
    location /chat/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /chat/index.html;
    }
    location = /chat {
        return 302 /chat/;
    }

    # REST и WS → backend (rewrite срезает /chat; proxy_pass без URI-части
    # передаёт уже изменённый $uri, query сохраняется)
    location /chat/api/v1/ws {
        set $backend_up http://backend:8000;
        rewrite ^/chat(/.*)$ $1 break;
        proxy_pass $backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /chat/api/v1/ {
        set $backend_up http://backend:8000;
        rewrite ^/chat(/.*)$ $1 break;
        proxy_pass $backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # LiveKit-сигналинг (/chat/livekit/rtc → livekit:7880/rtc)
    location /chat/livekit/ {
        set $livekit_up http://livekit:7880;
        rewrite ^/chat/livekit(/.*)$ $1 break;
        proxy_pass $livekit_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
