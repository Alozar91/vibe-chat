# vibe-chat frontend за системным nginx хоста (location /chat → этот контейнер :80).
# Системный nginx передаёт путь как есть (/chat/...), этот nginx обслуживает префикс.

server {
    listen 80;

    # SPA под подпутью: /chat/assets/... → dist/assets/... (alias выравнивает префикс)
    location /chat/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /chat/index.html;
    }
    location = /chat {
        return 302 /chat/;
    }

    # REST и WS → backend (путь /chat/api/v1/... выравнивается до /api/v1/...)
    location /chat/api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /chat/api/v1/ws {
        proxy_pass http://backend:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # LiveKit-сигналинг (/chat/livekit/rtc → livekit:7880/rtc)
    location /chat/livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
