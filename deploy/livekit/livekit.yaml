# LiveKit SFU (Docs/concept.md §17) — один контейнер, без Redis при одной ноде.
# Порты (§13): 7880/tcp — WS-сигналинг клиентов, 7881/tcp — TCP-fallback ICE,
# UDP-диапазон — медиа (должен быть открыт на хосте), TURN TLS 443 — coturn отдельно.
# ВНИМАНИЕ: для Windows-dev диапазон сужен до 51000–52000 (Hyper-V резервирует
# 50000–50059 и динамические куски выше); на VPS вернуть 50000–60000.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 51000
  port_range_end: 52000
  # сервер с выделенным IP достижим клиентами за NAT напрямую (исходящий UDP)
  use_external_ip: true
keys:
  # dev-ключи; для прода — свои (env compose: LIVEKIT_API_KEY/LIVEKIT_API_SECRET)
  devkey: devsecret
