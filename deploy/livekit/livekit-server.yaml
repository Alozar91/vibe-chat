# LiveKit SFU — серверный конфиг (Docs/concept.md §17, deploy/docker-compose.server.yml).
# VPS с выделенным IP: use_external_ip даёт достижимые кандидаты (dev-проблема
# hairpin NAT здесь не актуальна). Диапазон UDP 50000–50100 (100 портов —
# достаточно для MVP-стенда; соответствие ports в docker-compose.server.yml обязательно).
#
# API-ключи здесь НЕ задаются сознательно: единственный источник —
# LIVEKIT_KEYS env из compose (= LIVEKIT_API_KEY/LIVEKIT_API_SECRET из
# server.env). env-флаг перекрывает yaml (порядок: defaults → yaml → флаги),
# а без ключей сервер не примет ни один токен — конфиг fail-closed:
# забытые в server.env ключи не оставят активным дефолтный devkey.
port: 7880
rtc:
  tcp_port: 7881
  # 100 портов достаточно для MVP-стенда; соответствие ports в compose обязательно
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
# Prometheus-метрики для стресс-тестов/мониторинга: только localhost
# (в compose пробрасывается 127.0.0.1:6789), наружу не публикуется.
# Ключевые серии: livekit_participant_total, livekit_track_total,
# livekit_packet_loss*, livekit_retransmitted_bytes_*
prometheus_port: 6789
