# Vibe Chat — инфраструктура. Приложения в dev поднимаются локально (Docs/concept.md §13).
# Полный запуск в контейнерах: docker compose --profile full up --build
name: vibe-chat

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe}
      POSTGRES_DB: ${POSTGRES_DB:-vibe}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ хранит данные в /var/lib/postgresql/<major>/... — монтируем родителя
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data

  silo:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-vibe}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-vibe-secret}
      # CORS: браузерный PUT — cross-origin (§8); в dev разрешаем localhost-origins
      MINIO_API_CORS_ALLOW_ORIGIN: ${SILO_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - silodata:/data

  keycloak:
    image: keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # плейсхолдеры realm-export.json (подставляются при --import-realm):
      # без переменных импорт упадёт на невалидном redirect URI
      VIBE_PUBLIC_URL: http://localhost:5173
      VIBE_PUBLIC_ORIGIN: http://localhost:5173
      # frontendUrl realm'а = issuer токенов; бэкенд валидирует iss по
      # APP_KEYCLOAK_URL — значения должны совпадать.
      # KC 26 (hostname v2): поле realm.frontendUrl из realm-export больше НЕ
      # читается (RealmRepresentation его не имеет — импорт падает с
      # Unrecognized field); фиксированный hostname задаётся только env'ом
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_BACKEND_ADMIN_SECRET: ${KC_BACKEND_ADMIN_SECRET:-change-me-backend-admin-secret}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # ── Звонки (§17): LiveKit SFU ──────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    # LIVEKIT_NODE_IP — IP, анонсируемый клиентам для ICE (dev: адрес host-машины
    # в её же сети, т.к. браузер на той же машине; на VPS — публичный IP).
    # 127.0.0.1 работает только когда браузер на той же Windows-машине.
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7880:7880"       # WS-сигналинг
      - "7881:7881"       # TCP-fallback ICE
      # dev: 40000–40100 — НИЖЕ динамического диапазона Windows (49152+):
      # Hyper-V/WinNAT резервирует случайные сотни портов в 49152–65535
      # после каждого ребута (диапазоны сдвигаются — 51000-52000 перестал
      # подниматься). 40000–40100 стабилен. На VPS — 50000–50100/udp.
      - "40000-40100:40000-40100/udp"  # медиа
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  # ── Профиль full: приложения в контейнерах ─────────────────────────────
  backend:
    image: backend:dev
    profiles: ["full"]
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment: &backend_env
      APP_DB_URL: postgresql+asyncpg://vibe:vibe@postgres:5432/vibe
      APP_VALKEY_URL: valkey://valkey:6379/0
      APP_SILO_INTERNAL_URL: http://silo:9000
      APP_SILO_PUBLIC_URL: http://localhost:9000
      APP_SILO_ACCESS_KEY: ${SILO_ROOT_USER:-vibe}
      APP_SILO_SECRET_KEY: ${SILO_ROOT_PASSWORD:-vibe-secret}
      APP_KEYCLOAK_URL: http://keycloak:8080
      APP_KEYCLOAK_REALM: vibe-chat
      APP_KEYCLOAK_AUDIENCE: backend-api
      APP_KEYCLOAK_ADMIN_CLIENT_ID: backend-admin
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_BACKEND_ADMIN_SECRET:-change-me-backend-admin-secret}
      APP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      APP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      APP_LIVEKIT_WS_URL: ws://localhost:7880
      # открытая регистрация без инвайт-кода (§5); dev — включена
      APP_OPEN_REGISTRATION: ${APP_OPEN_REGISTRATION:-true}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      silo:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    image: frontend:dev
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  valkeydata:
  silodata:
