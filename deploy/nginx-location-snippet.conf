# Полный пример конфига СИСТЕМНОГО nginx хоста — единая точка входа двух проектов:
#   /know → vibe-know (его контейнерный nginx kb-nginx, деплой позже)
#   /chat → vibe-chat (контейнерный frontend-nginx, деплой сейчас)
# Файл положить в /etc/nginx/conf.d/ (или sites-available + symlink), затем:
#   nginx -t && nginx -s reload
# Подставьте свой домен вместо chat.example.com и путь к сертификату.
#
# Расклад портов на хосте:
#   системный nginx: 80 (ACME + редирект), 443 (оба проекта), 8444 (Keycloak vibe-chat)
#   vibe-know:  8082 kb-nginx (SPA+/api+/auth) | 8001 api | 8080 KC | 5432/6379/9090…
#   vibe-chat:  8090 frontend-nginx | 8002 backend | 8081 KC | 9002 Silo API | 9003 консоль
#               7881/tcp + 50000-50100/udp — LiveKit, напрямую (мимо nginx)

# WS через системный nginx: upgrade-заголовки должны пройти ОБА хопа
# (системный nginx → frontend-контейнер → backend, /chat/api/v1/ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME для certbot + редирект на HTTPS ──────────────────────────────
server {
    listen 80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: оба проекта ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # ── vibe-know — раскомментировать при его деплое ────────────────────────
    # Путь передаётся КАК ЕСТЬ: kb-nginx сам разруливает /know/ (SPA),
    # /api/ (REST) и /auth/ (Keycloak kb). Его nginx держит port 80 —
    # в deploy/docker-compose.yml vibe-know заменить "80:80"/"443:443"
    # на "127.0.0.1:8082:80" (TLS терминируется здесь).
    #
    # location /know/ {
    #     proxy_pass http://127.0.0.1:8082;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
    # location = /know { return 301 /know/; }
    # location /api/  {
    #     proxy_pass http://127.0.0.1:8082;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     client_max_body_size 110m;
    # }
    # location /auth/ {
    #     proxy_pass http://127.0.0.1:8082;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    # }

    # ── vibe-chat: SPA + REST + WS + LiveKit-сигналинг одним префиксом ──────
    # Путь как есть: frontend-nginx обслуживает /chat/ (alias + SPA-fallback),
    # /chat/api/v1/ → backend:8000, /chat/livekit/ → livekit:7880
    # (deploy/frontend-nginx.conf). Upgrade-заголовки обязательны (WS).
    location /chat/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location = /chat {
        return 302 /chat/;
    }

    # ── vibe-chat: Silo (presigned PUT/GET файлов, §8) ──────────────────────
    # Presigned URL = https://домен/silo/vibe-files/...; слэш в proxy_pass
    # СРЕЗАЕТ префикс /silo (S3-путь /vibe-files/...), Host сохраняется —
    # он входит в подпись. Same-origin — CORS не нужен.
    location /silo/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        client_max_body_size 110m;
    }

    # Корень: пока оба проекта живут по подпутям (нужное раскомментировать)
    # location = / { return 302 /know/; }
    location / {
        return 404;
    }
}

# ── Keycloak vibe-chat: отдельный порт (issuer = https://домен:8444) ────────
server {
    listen 8444 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
