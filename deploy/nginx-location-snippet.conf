# ── vibe-chat (тестовый чат) ──────────────────────────────────────────────
# Вставить в server {} системного nginx (рядом с location /know).
# Требуется: dist собран с VITE_BASE_PATH=/chat/ (см. deploy/server.env.example).

# SPA + API + WS + LiveKit-сигналинг — одним префиксом во frontend-контейнер
location /chat/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /chat {
    return 302 /chat/;
}

# Silo (presigned PUT/GET файлов): Host сохраняется — подпись совпадает (§8)
location /silo/ {
    proxy_pass http://127.0.0.1:9001;
    proxy_set_header Host $host;
    client_max_body_size 110m;
}

